[project]
name = "lamps-ai-backend"
version = "0.1.0"
description = "Lamps AI — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "mercadopago>=2.3.0",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
    "apscheduler>=3.10.0,<4",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
